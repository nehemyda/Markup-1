<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vpin extension settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 520px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    label { display: block; font-weight: 700; margin: 18px 0 6px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .row .primary { width: auto; padding: 9px 18px; }
    #status { margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Vpin extension settings</h1>
  <p class="muted">Where your team's Vpin runs. Use the default while testing on this computer; change it to the live address once Vpin is hosted.</p>
  <label for="server">Vpin address</label>
  <input id="server" type="url" placeholder="https://vpin.example.com">
  <div class="row">
    <button id="save" class="primary">Save</button>
    <button id="reset" class="link">Use http://localhost:3000</button>
  </div>
  <div id="status" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
