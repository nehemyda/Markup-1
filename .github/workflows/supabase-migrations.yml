# Applies new database changes (supabase/migrations/*.sql) to the live Supabase project when they reach main.
# The security-rule tests run first; if they fail, nothing is applied.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables → Actions), an access
# token from supabase.com/dashboard/account/tokens. Until it is set, the deploy is skipped. SUPABASE_DB_PASSWORD (the
# "Markup" project's database password) is optional; without it the CLI signs in to the database with the token.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:db

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # The "Markup" project (VITE_SUPABASE_URL in .env)
      SUPABASE_PROJECT_REF: bngziuiofcnwgkseknrf
    steps:
      - name: Check the Supabase token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so no database changes were applied."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.122.0
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show what will be applied
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase migration list --linked
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --linked
